<title>合成大西瓜 · 我的版本</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #26313d;
    background: linear-gradient(165deg, #ffe9f1 0%, #e9f2ff 42%, #e4fff4 100%);
    user-select: none;
  }

  .app {
    height: 100%; width: 100%; max-width: 580px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px 12px 10px;
  }

  /* ---------- 顶部信息条 ---------- */
  .hud {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.78);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 6px 18px rgba(120,140,180,.14);
    border-radius: 16px; padding: 8px 12px;
    flex: 0 0 auto;
  }
  .stat { display: flex; flex-direction: column; line-height: 1.15; min-width: 62px; }
  .stat .label { font-size: 11px; color: #8a97a8; letter-spacing: .5px; }
  .stat b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat.best b { font-size: 17px; color: #7b8aa0; }
  .spacer { flex: 1; }

  .next { display: flex; align-items: center; gap: 8px; }
  .next .label { font-size: 11px; color: #8a97a8; }
  .next-bubble {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; overflow: hidden;
    background: rgba(255,255,255,.55);
    border: 2px solid rgba(255,255,255,.95);
    box-shadow: inset 0 0 10px rgba(140,160,190,.18), 0 2px 8px rgba(120,140,180,.16);
    position: relative;
  }
  .next-bubble img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .next-bubble span { font-size: 22px; line-height: 1; }

  /* ---------- 舞台 ---------- */
  .stage {
    position: relative; flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: pointer;
  }
  #game {
    display: block; border-radius: 20px;
    box-shadow: 0 16px 38px rgba(110,135,175,.22);
    touch-action: none;
  }

  /* ---------- 遮罩层 ---------- */
  .overlay {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    border-radius: 20px;
    background: rgba(250,252,255,.72);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    z-index: 5; padding: 16px;
  }
  .overlay.show { display: flex; }
  .panel {
    width: min(320px, 88%);
    background: #fff; border-radius: 22px; padding: 22px 20px;
    box-shadow: 0 20px 50px rgba(90,115,160,.28);
    text-align: center;
  }
  .panel h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: 1px; }
  .panel .sub { color: #8a97a8; font-size: 13px; margin-bottom: 16px; }
  .panel .bigscore {
    font-size: 46px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(120deg, #ff6b8b, #ff9a5b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 4px 0 2px; font-variant-numeric: tabular-nums;
  }
  .panel .rowline { font-size: 13px; color: #7b8aa0; margin-bottom: 18px; }
  .btn {
    display: inline-block; width: 100%; border: 0; cursor: pointer;
    padding: 13px 18px; border-radius: 14px; font-size: 16px; font-weight: 700;
    color: #fff; letter-spacing: 1px;
    background: linear-gradient(135deg, #ff7a95, #ff9f68);
    box-shadow: 0 8px 20px rgba(255,122,149,.4);
    transition: transform .12s ease, box-shadow .12s ease;
    font-family: inherit;
  }
  .btn:active { transform: translateY(2px) scale(.99); box-shadow: 0 4px 12px rgba(255,122,149,.35); }
  .btn.ghost {
    background: #f1f5fb; color: #55637a; box-shadow: none; margin-top: 9px; font-weight: 600;
  }
  .howto { font-size: 12.5px; color: #93a0b2; line-height: 1.85; margin-top: 14px; text-align: left; }
  .howto b { color: #66748c; }

  /* ---------- 加载进度 ---------- */
  .loadbar {
    height: 10px; border-radius: 6px; overflow: hidden;
    background: #eef3fa; margin: 18px 6px 8px;
  }
  .loadbar > i {
    display: block; height: 100%; width: 0%;
    border-radius: 6px; transition: width .25s ease;
    background: linear-gradient(135deg, #ff7a95, #ff9f68);
  }
  .loadnum { font-size: 13px; color: #93a0b2; letter-spacing: 1px; }
  .loadwarn {
    margin-top: 16px; padding: 12px 14px; border-radius: 12px;
    background: #fff8ec; color: #8a6a33; font-size: 13px; line-height: 1.7;
    text-align: left;
  }
  .loadwarn .btn { margin-top: 10px; font-size: 14px; padding: 10px 14px; }

  /* ---------- 底部 ---------- */
  .bottom { flex: 0 0 auto; display: flex; flex-direction: column; gap: 7px; }
  .toolbar { display: flex; gap: 8px; }
  .tool {
    flex: 1; border: 0; cursor: pointer; font-family: inherit;
    padding: 9px 6px; border-radius: 12px; font-size: 13px; font-weight: 600;
    color: #5b6a82; background: rgba(255,255,255,.8);
    box-shadow: 0 4px 12px rgba(120,140,180,.13);
    transition: transform .1s ease, background .15s ease;
  }
  .tool:active { transform: scale(.97); }
  .tool.off { opacity: .5; }

  .gallery {
    display: flex; justify-content: center; gap: 4px; flex-wrap: nowrap;
    padding: 6px 4px; border-radius: 14px;
    background: rgba(255,255,255,.6);
    box-shadow: 0 4px 14px rgba(120,140,180,.10);
    overflow: hidden;
  }
  .slot {
    flex: 1 1 0; aspect-ratio: 1/1; max-width: 42px;
    border-radius: 50%; display: grid; place-items: center; overflow: hidden;
    background: rgba(240,245,252,.9);
    border: 2px solid rgba(255,255,255,.9);
    filter: grayscale(1) opacity(.38);
    transition: filter .35s ease, transform .35s ease, box-shadow .35s ease;
    font-size: 15px;
  }
  .slot img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .slot.on { filter: none; transform: translateY(-1px); }
  .slot.max { box-shadow: 0 0 0 2px #ff8fa3, 0 0 12px rgba(255,143,163,.6); }
  .hint { text-align: center; font-size: 11.5px; color: #98a5b7; }
  .hint kbd {
    background: #fff; border-radius: 5px; padding: 1px 5px; font-size: 11px;
    box-shadow: 0 1px 3px rgba(120,140,180,.25); font-family: inherit; color: #66748c;
  }

  @media (max-width: 420px) {
    .app { padding: 8px 8px 8px; gap: 6px; }
    .stat b { font-size: 19px; }
    .next-bubble { width: 40px; height: 40px; }
  }
  @media (max-height: 620px) {
    .gallery { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="hud">
    <div class="stat"><span class="label">分数</span><b id="score">0</b></div>
    <div class="stat best"><span class="label">最高分</span><b id="best">0</b></div>
    <div class="spacer"></div>
    <div class="next">
      <span class="label">下一个</span>
      <div class="next-bubble" id="nextBubble"><span id="nextEmoji">🍇</span><img id="nextImg" alt=""></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>

    <div class="overlay show" id="overlay">
      <div class="panel" id="panel"></div>
    </div>

    <div class="gallery" id="gallery"></div>
    <div class="toolbar">
      <button class="tool" id="btnRestart">🔄 重新开始</button>
      <button class="tool" id="btnSound">🔊 音效</button>
      <button class="tool" id="btnFull">⛶ 全屏</button>
    </div>
    <div class="hint">
      <kbd>←</kbd> <kbd>→</kbd> 移动 &nbsp;·&nbsp; <kbd>空格</kbd> / 点击 放球 &nbsp;·&nbsp; <kbd>R</kbd> 重开
    </div>
  </div>

</div>

<!-- 依赖库：物理引擎（必须最先加载） -->
<script src="lib/matter.min.js"></script>
<!-- 设置文件：你要改的就是这个 -->
<script src="config.js"></script>
<!-- 人物轮廓数据（由 tools/analyze-images.js 自动生成，决定碰撞体积） -->
<script src="images-meta.js"></script>
<!-- 游戏规则 -->
<script src="game-core.js"></script>

<script>
(function () {
  'use strict';

  var TAU = Math.PI * 2;

  /* =========================================================
   * 0. 小工具
   * ========================================================= */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function $(id) { return document.getElementById(id); }

  function withAlpha(color, alpha) {
    if (!color) return 'rgba(255,255,255,' + alpha + ')';
    var c = String(color).trim();
    if (c.charAt(0) === '#') {
      var hex = c.slice(1);
      if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
      if (hex.length === 6) {
        var n = parseInt(hex, 16);
        if (isFinite(n)) {
          return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
        }
      }
    }
    if (c.indexOf('rgb(') === 0) return c.replace('rgb(', 'rgba(').replace(')', ',' + alpha + ')');
    if (c.indexOf('rgba(') === 0) return c;
    return c;
  }

  function easeOutBack(t) {
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  /* =========================================================
   * 1. 音效（纯代码合成，不需要音频文件）
   * ========================================================= */
  var Sfx = {
    ctx: null,
    enabled: true,
    volume: 0.5,
    master: null,

    init: function () {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
        return;
      }
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.volume;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    },

    setVolume: function (v) { this.volume = v; if (this.master) this.master.gain.value = v; },

    tone: function (o) {
      if (!this.enabled || !this.ctx) return;
      var ctx = this.ctx, t0 = ctx.currentTime + (o.delay || 0);
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.freq, t0);
      if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slideTo), t0 + o.dur);
      var peak = Math.max(0.0001, (o.gain == null ? 0.25 : o.gain));
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.008));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + o.dur + 0.03);
    },

    noise: function (o) {
      if (!this.enabled || !this.ctx) return;
      var ctx = this.ctx, t0 = ctx.currentTime + (o.delay || 0);
      var dur = o.dur || 0.2;
      var len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = ctx.createBufferSource(); src.buffer = buf;
      var f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.setValueAtTime(o.cutoff || 1600, t0);
      var g = ctx.createGain();
      g.gain.setValueAtTime(o.gain == null ? 0.18 : o.gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t0); src.stop(t0 + dur + 0.02);
    },

    drop: function (basePitch) {
      this.tone({ freq: basePitch || 520, slideTo: (basePitch || 520) * 0.62, dur: 0.075, type: 'triangle', gain: 0.16 });
    },

    merge: function (level, basePitch) {
      // 五声音阶，等级越高越好听
      var steps = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];
      var step = steps[Math.min(steps.length - 1, Math.max(0, level - 2))];
      var f = (basePitch || 440) * Math.pow(2, step / 12);
      this.tone({ freq: f, dur: 0.20, type: 'sine', gain: 0.20 });
      this.tone({ freq: f * 2, dur: 0.13, type: 'triangle', gain: 0.09, delay: 0.012 });
      this.noise({ dur: 0.09, gain: 0.05, cutoff: 3200 });
    },

    boom: function () {
      this.tone({ freq: 180, slideTo: 60, dur: 0.42, type: 'sine', gain: 0.3 });
      this.noise({ dur: 0.42, gain: 0.22, cutoff: 1200 });
      this.tone({ freq: 720, slideTo: 1500, dur: 0.3, type: 'triangle', gain: 0.12, delay: 0.03 });
    },

    over: function () {
      var self = this;
      [0, 0.13, 0.27].forEach(function (d, i) {
        self.tone({ freq: 520 * Math.pow(0.78, i), dur: 0.3, type: 'sine', gain: 0.2, delay: d });
      });
      this.noise({ dur: 0.6, gain: 0.1, cutoff: 900, delay: 0.05 });
    },

    ui: function () { this.tone({ freq: 640, dur: 0.06, type: 'sine', gain: 0.1 }); }
  };

  /* =========================================================
   * 2. 存档（最高分）
   * ========================================================= */
  var storage = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  };

  /* =========================================================
   * 3. 创建游戏
   * ========================================================= */
  var rawConfig = window.GAME_CONFIG || {};
  var core = window.SuikaCore;

  if (!window.Matter) {
    document.body.innerHTML = '<div style="padding:40px;font-size:16px;line-height:2">' +
      '❌ 没有加载到物理引擎 lib/matter.min.js<br>请确认这个文件和 index.html 在同一个文件夹里。</div>';
    return;
  }

  var everUnlocked = {};   // 本次打开期间解锁过的等级（用于底部图鉴）

  var game = new core.SuikaGame({
    config: rawConfig,
    storage: storage,
    imageMeta: window.IMAGE_META || null,
    hooks: {
      onSpawn: function (rec) { everUnlocked[rec.level] = true; },
      onSfx: function (e) {
        if (!Sfx.enabled) return;
        if (e.type === 'drop') Sfx.drop(game.cfg.sound.dropPitch);
        else if (e.type === 'merge') Sfx.merge(e.level, game.cfg.sound.mergeBasePitch);
        else if (e.type === 'boom') Sfx.boom();
      },
      onGameOver: function () {
        if (Sfx.enabled) Sfx.over();
        showGameOver();
      }
    }
  });

  var cfg = game.cfg;
  var W = game.W, H = game.H;

  // 调试用：在地址栏加参数就能临时改变行为，不用改文件
  //   .../index.html?hitbox=1   把真实碰撞轮廓画成红线
  //   .../index.html?circle=1   临时切回圆形碰撞，方便对比
  try {
    var qs = String(window.location.search || '');
    if (qs.indexOf('hitbox') >= 0) cfg.appearance.showHitbox = true;
    if (qs.indexOf('circle') >= 0) {
      game.cfg.physics.collisionShape = 'circle';
      game._shapeCache = {};
    }
  } catch (e) { /* 忽略 */ }

  Sfx.enabled = !!cfg.sound.enabled;
  Sfx.volume = typeof cfg.sound.volume === 'number' ? cfg.sound.volume : 0.5;

  /* =========================================================
   * 4. 加载每个等级的人物图片
   * ========================================================= */
  // "单文件版"会把图片直接内嵌在网页里（data:...），这里优先用内嵌的那份。
  // 文件夹版没有这个变量，就按平常的路径去 images/ 里读，两边都能跑。
  var INLINE_IMAGES = window.__INLINE_IMAGES || null;

  /* 一张图可能有好几种格式，按顺序试：
   *   1. 内嵌的 data:（单文件版）
   *   2. WebP —— 比 PNG 小 5 倍多，加载快很多
   *   3. PNG  —— 兜底，任何浏览器都认
   * 这样既快，又不会因为浏览器不支持 WebP 而坏掉。 */
  function candidatesOf(p) {
    if (INLINE_IMAGES && INLINE_IMAGES[p]) return [INLINE_IMAGES[p]];
    var list = [];
    if (/\.png$/i.test(p)) {
      var w = p.replace(/\.png$/i, '.webp');
      list.push((INLINE_IMAGES && INLINE_IMAGES[w]) ? INLINE_IMAGES[w] : w);
    }
    list.push(p);
    return list;
  }

  var IMG_RETRY = 3;                       // 每种格式最多重试几次（防网络抖动）
  var loadState = { total: 0, ok: 0, failed: 0, done: false };
  var images = [];

  function recountImages() {
    var ok = 0, no = 0;
    for (var i = 0; i < images.length; i++) {
      if (images[i].__ok === true) ok++;
      else if (images[i].__ok === false) no++;
    }
    loadState.ok = ok;
    loadState.failed = no;
    loadState.done = (ok + no) >= loadState.total;
    refreshStaticUI();
    updateLoadProgress();
  }

  function loadImageSmart(img, path) {
    var cands = candidatesOf(path);
    var ci = 0, tries = 0, settled = false;

    function finish(ok) {
      if (settled) return;
      settled = true;
      img.__ok = ok;
      recountImages();
    }

    function attempt() {
      if (ci >= cands.length) { finish(false); return; }
      var url = cands[ci];
      if (url.indexOf('data:') === 0) { img.src = url; return; }   // 内嵌的不用重试
      img.src = tries > 0 ? url + (url.indexOf('?') >= 0 ? '&' : '?') + 'r=' + tries : url;
    }

    img.onload = function () { finish(true); };
    img.onerror = function () {
      var isLast = (ci >= cands.length - 1);
      if (!isLast) { ci++; tries = 0; attempt(); return; }          // WebP 不行就立刻换 PNG
      if (tries < IMG_RETRY) { tries++; setTimeout(attempt, 500 * tries); return; }
      finish(false);
    };

    attempt();
  }

  loadState.total = game.levels.length;
  images = game.levels.map(function (L) {
    var img = new Image();
    img.decoding = 'async';
    loadImageSmart(img, L.image);
    return img;
  });

  /** 页面重新可见 / 窗口重新获得焦点时，把没加载出来的图再试一次 */
  function retryFailedImages() {
    var n = 0;
    for (var i = 0; i < images.length; i++) {
      if (images[i].__ok === false) {
        images[i].__ok = undefined;
        loadImageSmart(images[i], game.levels[i].image);
        n++;
      }
    }
    return n;
  }

  // 图片的宽高比（抠好的图一般是正方形，所以这个值通常是 1）
  function imgReady(img) {
    return img && img.__ok === true && img.naturalWidth > 0;
  }

  /* =========================================================
   * 5. 画布尺寸
   * ========================================================= */
  var canvas = $('game');
  var ctx = canvas.getContext('2d');
  var stage = $('stage');
  var dpr = 1;
  var scale = 1;
  var bgCanvas = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    var stageRect = stage.getBoundingClientRect();
    var availW = Math.max(120, stageRect.width);
    var availH = Math.max(160, stageRect.height);

    scale = Math.min(availW / W, availH / H);
    var cssW = Math.floor(W * scale);
    var cssH = Math.floor(H * scale);

    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));

    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);

    buildBackground(canvas.width, canvas.height);
  }

  /* =========================================================
   * 6. 静态背景预渲染（地板、墙、警戒线）
   * ========================================================= */
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function buildBackground(pxW, pxH) {
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = pxW; bgCanvas.height = pxH;
    var c = bgCanvas.getContext('2d');
    c.setTransform(pxW / W, 0, 0, pxH / H, 0, 0);

    // 场地内部渐变
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#fbfdff');
    g.addColorStop(0.55, '#f2f8ff');
    g.addColorStop(1, '#e8f2fd');
    roundRect(c, 0, 0, W, H, 20);
    c.fillStyle = g;
    c.fill();

    // 警戒线以上的"投放区"淡色
    var dz = c.createLinearGradient(0, 0, 0, cfg.dangerLine.y);
    dz.addColorStop(0, 'rgba(255,143,163,.10)');
    dz.addColorStop(1, 'rgba(255,143,163,0)');
    c.save();
    roundRect(c, 0, 0, W, H, 20); c.clip();
    c.fillStyle = dz;
    c.fillRect(0, 0, W, cfg.dangerLine.y);
    c.restore();

    // 淡淡的网格点
    c.save();
    roundRect(c, 0, 0, W, H, 20); c.clip();
    c.fillStyle = 'rgba(150,175,205,.13)';
    for (var y = 40; y < H; y += 40) {
      for (var x = 40; x < W; x += 40) {
        c.beginPath(); c.arc(x, y, 1.3, 0, TAU); c.fill();
      }
    }
    c.restore();

    // 警戒线
    c.save();
    c.setLineDash([10, 8]);
    c.lineWidth = 2;
    c.strokeStyle = withAlpha(cfg.dangerLine.color || '#ff5252', 0.55);
    c.beginPath(); c.moveTo(8, cfg.dangerLine.y); c.lineTo(W - 8, cfg.dangerLine.y); c.stroke();
    c.restore();

    // 外框
    c.save();
    var wg = c.createLinearGradient(0, 0, W, H);
    wg.addColorStop(0, 'rgba(255,255,255,.95)');
    wg.addColorStop(0.5, 'rgba(214,229,246,.95)');
    wg.addColorStop(1, 'rgba(255,255,255,.95)');
    roundRect(c, 2.5, 2.5, W - 5, H - 5, 19);
    c.lineWidth = 5; c.strokeStyle = wg; c.stroke();
    roundRect(c, 6, 6, W - 12, H - 12, 16);
    c.lineWidth = 2; c.strokeStyle = 'rgba(168,192,220,.45)'; c.stroke();
    c.restore();
  }

  /* =========================================================
   * 7. 画球
   * ========================================================= */
  var gradCache = {};

  function bubbleGradient(level, r, color, alpha) {
    var key = level + '_' + Math.round(alpha * 100);
    if (gradCache[key]) return gradCache[key];
    var g = ctx.createRadialGradient(-r * 0.32, -r * 0.36, r * 0.08, 0, 0, r);
    g.addColorStop(0, withAlpha(color, Math.min(1, alpha * 1.9)));
    g.addColorStop(0.7, withAlpha(color, alpha));
    g.addColorStop(1, withAlpha(color, alpha * 0.72));
    gradCache[key] = g;
    return g;
  }

  function solidGradient(level, r, color) {
    var key = 's' + level;
    if (gradCache[key]) return gradCache[key];
    var g = ctx.createRadialGradient(-r * 0.34, -r * 0.4, r * 0.08, 0, 0, r * 1.06);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.22, withAlpha(color, 0.92));
    g.addColorStop(1, withAlpha(color, 1));
    gradCache[key] = g;
    return g;
  }

  function popScaleOf(rec) {
    if (!rec.popIn || rec.popT >= 1) return 1;
    return 0.5 + 0.5 * easeOutBack(rec.popT);
  }

  // 影子用渐变模拟，比 ctx.filter=blur 快很多
  function shadowGradient(level, r) {
    var key = 'sh' + level;
    if (gradCache[key]) return gradCache[key];
    var g = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r);
    g.addColorStop(0, 'rgba(56,84,124,1)');
    g.addColorStop(0.72, 'rgba(56,84,124,0.55)');
    g.addColorStop(1, 'rgba(56,84,124,0)');
    gradCache[key] = g;
    return g;
  }

  function drawCircleBall(rec, opts) {
    opts = opts || {};
    var L = game.levels[rec.level - 1];
    var r = rec.radius;
    var pos = rec.body ? rec.body.position : { x: rec.x, y: rec.y };
    var angle = 0;
    if (rec.body && cfg.appearance.rotateWithPhysics) {
      angle = rec.body.angle * (cfg.appearance.rotateAmount == null ? 0.35 : cfg.appearance.rotateAmount);
    }
    var s = (opts.scale == null ? popScaleOf(rec) : opts.scale) * (opts.extraScale || 1);
    var img = images[rec.level - 1];
    var hasImg = imgReady(img);

    ctx.save();
    ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
    ctx.translate(pos.x, pos.y);
    ctx.rotate(angle);
    ctx.scale(s, s);

    // 地面投影
    if (!opts.noShadow && r > 7) {
      ctx.save();
      ctx.globalAlpha *= 0.17;
      ctx.beginPath();
      ctx.arc(0, r * 0.13, r, 0, TAU);
      ctx.fillStyle = shadowGradient(rec.level, r);
      ctx.fill();
      ctx.restore();
    }

    if (hasImg) {
      // 半透明彩色泡泡打底，人物完整叠在上面
      if (cfg.appearance.showBubble !== false) {
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
        ctx.fillStyle = bubbleGradient(rec.level, r, L.color, cfg.appearance.bubbleAlpha == null ? 0.3 : cfg.appearance.bubbleAlpha);
        ctx.fill();
      }
      ctx.save();
      if (cfg.appearance.clipImageToCircle) {
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
      }
      var size = 2 * r;
      var iscale = (L.imageScale != null)
        ? L.imageScale
        : (cfg.appearance.imageScale == null ? 1 : cfg.appearance.imageScale);
      var iw = img.naturalWidth, ih = img.naturalHeight;
      var ratio = cfg.appearance.clipImageToCircle
        ? Math.max(size / iw, size / ih)
        : Math.min(size / iw, size / ih);
      ratio *= iscale;
      var dw = iw * ratio, dh = ih * ratio;
      var dy = (L.imageOffsetY != null)
        ? L.imageOffsetY
        : (cfg.appearance.imageOffsetY || 0);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, -dw / 2, -dh / 2 + dy, dw, dh);
      ctx.restore();
    } else {
      // 没有图片 → 彩色小球 + 表情
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
      ctx.fillStyle = solidGradient(rec.level, r, L.color);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-r * 0.34, -r * 0.38, r * 0.2, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fill();
      if (r > 9 && L.emoji) {
        ctx.font = Math.round(r * 1.05) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(L.emoji, 0, r * 0.08);
      }
    }

    // 白边
    if (cfg.appearance.showRing !== false) {
      ctx.beginPath(); ctx.arc(0, 0, Math.max(1, r - 1), 0, TAU);
      ctx.lineWidth = Math.max(1.2, r * 0.055);
      ctx.strokeStyle = 'rgba(255,255,255,.92)';
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, Math.max(1, r - 1), 0, TAU);
      ctx.lineWidth = Math.max(0.8, r * 0.03);
      ctx.strokeStyle = withAlpha(L.color, 0.55);
      ctx.stroke();
    }

    // 刚合成时的白光一闪
    if (rec.spawnFlash > 0) {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,' + (rec.spawnFlash * 0.5) + ')';
      ctx.fill();
    }

    ctx.restore();
  }

  /* =========================================================
   * 7.5 按人物真实轮廓画（碰撞体也是一模一样的形状）
   * ========================================================= */

  /** 把轮廓的每一块多边形拼成一条路径 */
  function pathFromParts(shape) {
    ctx.beginPath();
    for (var i = 0; i < shape.parts.length; i++) {
      var vs = shape.parts[i];
      if (!vs || vs.length < 3) continue;
      ctx.moveTo(vs[0].x, vs[0].y);
      for (var j = 1; j < vs.length; j++) ctx.lineTo(vs[j].x, vs[j].y);
      ctx.closePath();
    }
  }

  function drawSilhouetteBall(rec, shape, opts) {
    opts = opts || {};
    var L = game.levels[rec.level - 1];
    var img = images[rec.level - 1];
    var pos = rec.body ? rec.body.position : { x: rec.x, y: rec.y };
    // 图和碰撞体必须严格同步旋转，所以这里不打折
    var angle = rec.body ? rec.body.angle : 0;
    var s = (opts.scale == null ? popScaleOf(rec) : opts.scale) * (opts.extraScale || 1);

    // 图片中心在世界坐标的位置（刚体质心 ≠ 图片中心）
    var il = shape.imgLocal;
    var ca = Math.cos(angle), sa = Math.sin(angle);
    var icx = pos.x + il.x * ca - il.y * sa;
    var icy = pos.y + il.x * sa + il.y * ca;

    var w = shape.drawW, h = shape.drawH;
    var minWH = Math.min(w, h);

    ctx.save();
    ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
    ctx.translate(icx, icy);
    ctx.rotate(angle);
    ctx.scale(s, s);

    // 影子：把轮廓往下错一点，填一层淡深色（让人物从浅色背景里"浮"起来）
    if (!opts.noShadow && w > 8) {
      ctx.save();
      ctx.globalAlpha *= 0.18;
      ctx.translate(0, h * 0.05);
      pathFromParts(shape);
      ctx.fillStyle = '#2f4a70';
      ctx.fill();
      ctx.restore();
    }

    var hasImg = imgReady(img);

    /* 人物背后铺色：默认【不铺】—— 铺了就等于把碰撞范围画出来了。
     * 只有两种情况下才铺：
     *   1. 你自己在 config.js 里把 showBubble 改成 true
     *   2. 这个等级没有图片（否则只剩一个表情符号飘在空中，看不清） */
    var wantFill = hasImg ? (cfg.appearance.showBubble === true) : true;
    if (wantFill) {
      ctx.save();
      var fillAlpha = hasImg
        ? Math.min(1, (cfg.appearance.bubbleAlpha == null ? 0.3 : cfg.appearance.bubbleAlpha) * 2.2)
        : 0.88;
      ctx.globalAlpha *= fillAlpha;
      pathFromParts(shape);
      ctx.fillStyle = L.color;
      ctx.fill();
      ctx.restore();
    }

    if (hasImg) {
      ctx.save();
      if (cfg.appearance.clipImageToCircle) { pathFromParts(shape); ctx.clip(); }
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();
    } else if (L.emoji) {
      ctx.save();
      ctx.font = Math.round(minWH * 0.8) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(L.emoji, 0, 0);
      ctx.restore();
    }

    /* 描边：默认【不描】—— 描了同样会把碰撞轮廓暴露出来。
     * 只有 showRing 明确设成 true 才描；没有图片时描一圈，方便看清边界。 */
    var wantRing = hasImg ? (cfg.appearance.showRing === true) : true;
    if (wantRing) {
      ctx.save();
      pathFromParts(shape);
      ctx.lineWidth = Math.max(1, minWH * 0.035);
      ctx.strokeStyle = 'rgba(255,255,255,.92)';
      ctx.stroke();
      pathFromParts(shape);
      ctx.lineWidth = Math.max(0.7, minWH * 0.017);
      ctx.strokeStyle = withAlpha(L.color, 0.6);
      ctx.stroke();
      ctx.restore();
    }

    if (rec.spawnFlash > 0) {
      ctx.save();
      pathFromParts(shape);
      ctx.fillStyle = 'rgba(255,255,255,' + (rec.spawnFlash * 0.55) + ')';
      ctx.fill();
      ctx.restore();
    }

    // 调试开关：把碰撞体画成红线
    if (cfg.appearance.showHitbox) {
      ctx.save();
      pathFromParts(shape);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,30,30,.85)';
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }

  /** 统一入口：按等级的碰撞形状选画法 */
  function drawBall(rec, opts) {
    var shape = rec.shape || game.shapeOf(rec.level);
    if (shape && shape.kind === 'silhouette') {
      drawSilhouetteBall(rec, shape, opts);
    } else {
      drawCircleBall(rec, opts);
    }
  }

  /* =========================================================
   * 8. 画特效
   * ========================================================= */
  function drawEffects() {
    var list = game.effects;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var t = e.t / e.life;
      if (e.kind === 'pop') {
        var rr = e.radius * (0.4 + 0.9 * t);
        ctx.beginPath(); ctx.arc(e.x, e.y, rr, 0, TAU);
        ctx.lineWidth = Math.max(1, 7 * (1 - t));
        ctx.strokeStyle = withAlpha(e.color, 0.75 * (1 - t));
        ctx.stroke();
      } else if (e.kind === 'particle') {
        ctx.globalAlpha = Math.max(0, 1 - t);
        ctx.beginPath(); ctx.arc(e.x, e.y, e.size * (1 - t * 0.6), 0, TAU);
        ctx.fillStyle = e.color;
        ctx.fill();
        ctx.globalAlpha = 1;
      } else if (e.kind === 'text') {
        var y = e.y - 42 * t;
        ctx.globalAlpha = Math.max(0, 1 - t * t);
        ctx.font = '700 22px "Segoe UI","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.9)';
        ctx.strokeText(e.text, e.x, y);
        ctx.fillStyle = e.color;
        ctx.fillText(e.text, e.x, y);
        ctx.globalAlpha = 1;
      }
    }
  }

  /* =========================================================
   * 9. 画瞄准线
   * ========================================================= */
  function drawAim() {
    if (game.status !== 'playing' || !game.heldLevel) return;
    if (cfg.appearance.showDropGuide === false) return;

    var L = game.levels[game.heldLevel - 1];
    var shape = game.shapeOf(game.heldLevel);
    var r = shape.halfW;                       // 用真实碰撞体的半宽
    var hh = shape.halfH;
    var range = game.aimRange();
    var x = clamp(game.aimX, range.min, range.max);
    var y = Math.max(hh + 2, cfg.drop.spawnY);

    // 虚线
    ctx.save();
    ctx.setLineDash([7, 9]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = withAlpha(L.color, 0.5);
    ctx.beginPath();
    ctx.moveTo(x, y - hh - 6);
    ctx.lineTo(x, H - 6);
    ctx.stroke();
    ctx.restore();

    // 落点提示：画一条和碰撞体一样宽的地面标记
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.setLineDash([5, 6]);
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = withAlpha(L.color, 0.8);
    ctx.beginPath();
    ctx.moveTo(x - r, H - 6);
    ctx.lineTo(x + r, H - 6);
    ctx.stroke();
    ctx.restore();

    // 待放的球（半透明预览）
    drawBall({
      level: game.heldLevel, radius: shape.radius, shape: shape, x: x, y: y,
      popIn: false, spawnFlash: 0, body: null
    }, { alpha: 0.72, noShadow: true });
  }

  /* =========================================================
   * 10. 渲染主函数
   * ========================================================= */
  function render() {
    ctx.clearRect(0, 0, W, H);
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);

    var state = game.getState();

    // 警戒线告急时的红色呼吸效果
    if (state.status === 'playing' && state.dangerTimer > 200) {
      var p = clamp(state.dangerTimer / (state.dangerHold || 1500), 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.10 + 0.22 * p * (0.6 + 0.4 * Math.sin(performance.now() / 120));
      ctx.fillStyle = cfg.dangerLine.color || '#ff5252';
      roundRect(ctx, 4, 4, W - 8, cfg.dangerLine.y, 16);
      ctx.fill();
      ctx.restore();
    }

    for (var i = 0; i < state.balls.length; i++) drawBall(state.balls[i]);

    drawAim();
    drawEffects();
  }

  /* =========================================================
   * 11. 界面（分数 / 下一个 / 图鉴）
   * ========================================================= */
  var elScore = $('score'), elBest = $('best');
  var elNextImg = $('nextImg'), elNextEmoji = $('nextEmoji'), elNextBubble = $('nextBubble');
  var elGallery = $('gallery');
  var lastScore = -1, lastBest = -1, lastNext = -1, lastGalleryKey = '';

  function buildGallery() {
    if (cfg.misc.showLevelGallery === false) { elGallery.style.display = 'none'; return; }
    elGallery.innerHTML = '';
    game.levels.forEach(function (L, i) {
      var d = document.createElement('div');
      d.className = 'slot';
      d.title = L.name + '（第 ' + (i + 1) + ' 级）';
      var img = document.createElement('img');
      img.alt = L.name;
      // 直接用游戏已经加载好的那份，浏览器会命中缓存，不会重复下载
      img.src = (images[i] && images[i].src) || candidatesOf(L.image)[0];
      img.onload = function () { if (img.naturalWidth) { img.style.display = 'block'; d.dataset.hasimg = '1'; } };
      img.onerror = function () { img.style.display = 'none'; };
      var span = document.createElement('span');
      span.textContent = L.emoji || (i + 1);
      d.appendChild(img);
      d.appendChild(span);
      elGallery.appendChild(d);
    });
  }

  function refreshStaticUI() { lastGalleryKey = ''; }

  function updateUI() {
    if (game.score !== lastScore) { elScore.textContent = game.score; lastScore = game.score; }
    if (game.best !== lastBest) { elBest.textContent = game.best; lastBest = game.best; }

    if (cfg.misc.showNextPreview === false) {
      elNextBubble.parentNode.style.display = 'none';
    } else if (game.nextLevel && game.nextLevel !== lastNext) {
      lastNext = game.nextLevel;
      var L = game.levels[game.nextLevel - 1];
      var img = images[game.nextLevel - 1];
      if (imgReady(img)) {
        elNextImg.src = img.src;
        elNextImg.style.display = 'block';
        elNextEmoji.style.display = 'none';
      } else {
        elNextImg.style.display = 'none';
        elNextEmoji.style.display = 'block';
        elNextEmoji.textContent = L.emoji || game.nextLevel;
        elNextBubble.style.background = withAlpha(L.color, 0.28);
      }
    }

    if (cfg.misc.showLevelGallery !== false) {
      var key = '';
      for (var k in everUnlocked) key += k + ',';
      key += '|' + game.maxLevelReached;
      if (key !== lastGalleryKey) {
        lastGalleryKey = key;
        var slots = elGallery.children;
        for (var i = 0; i < slots.length; i++) {
          var lv = i + 1;
          var on = !!everUnlocked[lv];
          slots[i].classList.toggle('on', on);
          slots[i].classList.toggle('max', lv === game.maxLevelReached && on);
        }
      }
    }
  }

  /* =========================================================
   * 12. 遮罩面板（开始 / 结束）
   * ========================================================= */
  var overlay = $('overlay'), panel = $('panel');

  /* ---- 加载中：先把人物图片拉下来，加载完再放人进去玩 ----
   * 不然一开局是水果表情，等图下完了才变成照片，看着很怪。
   * 网络慢的话这一步可能有一两秒，所以给个进度条让心里有数。 */
  var loadShown = false;
  var loadDeadline = 0;          // 万一有图一直下不来，也别卡死
  var galleryRebuilt = false;

  function showLoading(stage, text) {
    loadShown = true;
    var pct = loadState.total ? Math.round(loadState.ok / loadState.total * 100) : 0;
    panel.innerHTML =
      '<h2>🍉 合成大西瓜</h2>' +
      '<div class="sub">' + (text || '正在加载人物图片') + '…</div>' +
      '<div class="loadbar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="loadnum">' + loadState.ok + ' / ' + loadState.total + '</div>';
    overlay.classList.add('show');
  }

  function updateLoadProgress() {
    if (!loadShown) return;

    if (!galleryRebuilt && loadState.done) {
      galleryRebuilt = true;
      buildGallery();          // 图下好了重建一遍图鉴，缩略图才是完整的
    }

    if (loadState.done) {
      showStart();
      return;
    }
    if (Date.now() > loadDeadline) {
      // 等太久了，先让玩家进去（缺的图会显示备用样式，之后再自动补）
      showStart();
      return;
    }
    // 只更新进度数字和进度条，不整块重画（避免闪）
    var bar = panel.querySelector('.loadbar > i');
    var num = panel.querySelector('.loadnum');
    if (bar && num) {
      bar.style.width = Math.round(loadState.ok / loadState.total * 100) + '%';
      num.textContent = loadState.ok + ' / ' + loadState.total;
    } else {
      showLoading();
    }
  }

  function showStart() {
    if (overlay.querySelector('#btnStart')) return;   // 已经是开始界面了就别重画
    panel.innerHTML =
      '<h2>🍉 合成大西瓜</h2>' +
      '<div class="sub">用你的照片，合成最大的那个人</div>' +
      '<button class="btn" id="btnStart">开 始 游 戏</button>' +
      '<div class="howto">' +
        '<b>怎么玩：</b><br>' +
        '· 移动鼠标（或手指）左右瞄准<br>' +
        '· 点击 / 按空格 放球<br>' +
        '· 两个<b>一样</b>的碰到一起 → 合成更大的<br>' +
        '· 堆过上面的红线就输了' +
      '</div>' +
      (loadState.failed > 0
        ? '<div class="loadwarn">有 ' + loadState.failed + ' 张人物图没加载出来，' +
          '会先用备用样式顶着。<button class="btn ghost" id="btnReloadImg">重新加载图片</button></div>'
        : '');
    overlay.classList.add('show');
    $('btnStart').onclick = function () {
      Sfx.init(); Sfx.ui();
      game.start();
      overlay.classList.remove('show');
      lastScore = lastBest = lastNext = lastGalleryKey = '';
      lastScore = -1;
    };
    var rb = $('btnReloadImg');
    if (rb) {
      rb.onclick = function () {
        rb.textContent = '正在重试…';
        loadState.failed = 0;
        retryFailedImages();
        recountImages();
        setTimeout(function () {
          if (loadState.ok + loadState.failed >= loadState.total) showStart();
        }, 400);
      };
    }
  }

  function showGameOver() {
    var isNewBest = game.score > 0 && game.score >= game.best;
    panel.innerHTML =
      '<h2>游戏结束</h2>' +
      '<div class="sub">' + (game.overReason || '') + '</div>' +
      '<div class="bigscore">' + game.score + '</div>' +
      '<div class="rowline">' +
        (isNewBest ? '🎉 新纪录！' : '最高分 ' + game.best) +
        ' &nbsp;·&nbsp; 合成了 ' + game.mergeCount + ' 次' +
      '</div>' +
      '<button class="btn" id="btnAgain">再 来 一 局</button>' +
      '<button class="btn ghost" id="btnClose">看看牌面</button>';
    overlay.classList.add('show');
    $('btnAgain').onclick = function () {
      Sfx.ui(); game.restart(); overlay.classList.remove('show');
      lastScore = -1; lastBest = -1; lastNext = -1; lastGalleryKey = '';
    };
    $('btnClose').onclick = function () { overlay.classList.remove('show'); };
  }

  /* =========================================================
   * 13. 输入
   * ========================================================= */
  function pointerToLogicalX(clientX) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width) return W / 2;
    return clamp((clientX - rect.left) / rect.width * W, 0, W);
  }

  stage.addEventListener('pointermove', function (e) {
    if (game.status !== 'playing') return;
    game.setAim(pointerToLogicalX(e.clientX));
  }, { passive: true });

  stage.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest('.overlay')) return;
    if (game.status !== 'playing') return;
    Sfx.init();
    game.setAim(pointerToLogicalX(e.clientX));
    game.drop();
    if (e.cancelable) e.preventDefault();
  });

  window.addEventListener('keydown', function (e) {
    if (game.status !== 'playing') {
      if (e.key === 'r' || e.key === 'R') { game.restart(); overlay.classList.remove('show'); }
      return;
    }
    var step = e.shiftKey ? 42 : 16;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { game.moveAim(-step); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { game.moveAim(step); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') {
      Sfx.init(); game.drop(); e.preventDefault();
    } else if (e.key === 'r' || e.key === 'R') {
      game.restart(); lastScore = -1; lastGalleryKey = '';
    }
  });

  $('btnRestart').onclick = function () {
    Sfx.init(); Sfx.ui();
    game.restart(); overlay.classList.remove('show');
    lastScore = -1; lastBest = -1; lastNext = -1; lastGalleryKey = '';
  };

  $('btnSound').onclick = function () {
    Sfx.init();
    Sfx.enabled = !Sfx.enabled;
    this.textContent = Sfx.enabled ? '🔊 音效' : '🔇 静音';
    this.classList.toggle('off', !Sfx.enabled);
    if (Sfx.enabled) Sfx.ui();
  };

  $('btnFull').onclick = function () {
    if (!document.fullscreenElement) {
      (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
    } else {
      (document.exitFullscreen || function () {}).call(document);
    }
  };

  /* =========================================================
   * 14. 主循环
   * ========================================================= */
  var last = performance.now();

  function frame(now) {
    var dt = now - last;
    last = now;
    if (dt > 100) dt = 16.7;   // 切标签页回来不要跳帧
    game.update(dt);
    render();
    updateUI();
    requestAnimationFrame(frame);
  }

  /* =========================================================
   * 15. 启动
   * ========================================================= */
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 80);
  });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });

  document.addEventListener('visibilitychange', function () {
    last = performance.now();
    // 切回来的时候，把还没加载出来的图片再试一次（网络刚才可能抽风了）
    if (!document.hidden && loadState.failed > 0) {
      retryFailedImages();
      recountImages();
    }
  });
  window.addEventListener('focus', function () {
    if (loadState.failed > 0) { retryFailedImages(); recountImages(); }
  });

  // 防止手机上拖动页面
  document.addEventListener('touchmove', function (e) {
    if (e.target.closest && e.target.closest('.stage')) e.preventDefault();
  }, { passive: false });

  buildGallery();
  resize();
  setTimeout(resize, 60);   // 字体/布局稳定后再量一次

  // 音效按钮初始状态
  if (!Sfx.enabled) { $('btnSound').textContent = '🔇 静音'; $('btnSound').classList.add('off'); }

  /* 先显示"正在加载人物图片"，图下完了（或等太久）再显示开始界面。
   * 这样一开局就是照片，不会先看到一堆水果表情。 */
  loadDeadline = Date.now() + 20000;    // 最多等 20 秒，之后也放人进去玩
  showLoading();
  if (loadState.done) showStart();

  requestAnimationFrame(frame);

  // 方便你在浏览器控制台里调戏
  window.__game = game;
  window.__images = images;
  window.__loadState = loadState;
})();
</script>
</body>
</html>
